<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | إدارة الصفحات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --bg: #061412; --card: rgba(12, 35, 31, 0.85);
      --text: #f0fdfa; --muted: #99f6e4;
      --line: rgba(16, 185, 129, 0.25); --primary: #10b981; --secondary: #06b6d4; --accent: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Cairo", sans-serif;
      background: linear-gradient(135deg, var(--bg), #04100e);
      color: var(--text); line-height: 1.8; padding: 40px 0; min-height: 100vh;
    }
    .container { width: min(800px, 92%); margin: auto; }
    .glass {
      background: var(--card); border: 1px solid var(--line); border-radius: 24px;
      padding: 30px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); backdrop-filter: blur(15px);
    }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--primary); }
    p.desc { color: var(--muted); font-size: 0.9rem; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.95rem; }
    input, textarea {
      width: 100%; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.3);
      color: var(--text); border-radius: 12px; padding: 12px 15px; font: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { min-height: 180px; resize: vertical; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      border-radius: 12px; padding: 12px 24px; border: none; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: 0.25s; background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #03120e; width: 100%;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .alert { padding: 12px 16px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; margin-top: 15px; display: none; }
    .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--primary); color: #6ee7b7; }
    .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
    .note { font-size: 0.8rem; color: var(--accent); margin-top: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass">
      <h1><i class="fa-solid fa-file-circle-plus"></i> لوحة التحكم وإنشاء الصفحات</h1>
      <p class="desc">أضف معلومات صفحتك الجديدة وسيقوم النظام بحفظها ونشرها فوراً على موقعك.</p>

      <form id="pageForm">
        <div class="form-group">
          <label><i class="fa-solid fa-key"></i> رمز الوصول الشخصي (GitHub Token)</label>
          <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" required>
          <div class="note">* يتم حفظ الرمز في متصفحك المحلي فقط بأمان تامة.</div>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-heading"></i> عنوان الصفحة</label>
          <input type="text" id="pageTitle" placeholder="مثال: مقال تقني جديد" required>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-link"></i> اسم رابط الصفحة (بالإنجليزية وبدون مسافات)</label>
          <input type="text" id="pageSlug" placeholder="tech-article" pattern="[a-zA-Z0-9-]+" title="حروف إنجليزية وأرقام وشخطات فقط" required>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-paragraph"></i> محتوى الصفحة</label>
          <textarea id="pageContent" placeholder="اكتب محتوى الصفحة هنا..." required></textarea>
        </div>

        <button type="submit" class="btn" id="submitBtn"><i class="fa-solid fa-paper-plane"></i> حفظ ونشر الصفحة فوراً</button>
      </form>

      <div class="alert alert-success" id="successMsg"></div>
      <div class="alert alert-error" id="errorMsg"></div>
    </div>
  </div>

  <script>
    const REPO_OWNER = 'rashedalabidi7-beep';
    const REPO_NAME = 'Personal-website-';

    document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';

    document.getElementById('pageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('ghToken').value.trim();
      const title = document.getElementById('pageTitle').value.trim();
      const slug = document.getElementById('pageSlug').value.trim().toLowerCase();
      const content = document.getElementById('pageContent').value.trim();

      const btn = document.getElementById('submitBtn');
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');

      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري النشر...';

      localStorage.setItem('gh_token', token);

      const htmlTemplate = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${title} | رشيد العبيدي</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root { --bg: #061412; --card: rgba(12, 35, 31, 0.85); --text: #f0fdfa; --muted: #99f6e4; --line: rgba(16, 185, 129, 0.25); --primary: #10b981; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Cairo", sans-serif; background: var(--bg); color: var(--text); padding: 50px 20px; line-height: 1.8; }
    .box { max-width: 800px; margin: auto; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 30px; backdrop-filter: blur(10px); }
    h1 { color: var(--primary); margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .content { white-space: pre-wrap; font-size: 1.05rem; }
    .back { display: inline-flex; align-items: center; gap: 8px; margin-top: 30px; color: var(--muted); text-decoration: none; font-weight: bold; }
    .back:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="box">
    <h1>${title}</h1>
    <div class="content">${content}</div>
    <a href="../index.html" class="back"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
  </div>
</body>
</html>`;

      const filePath = `pages/${slug}.html`;
      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`;

      try {
        let sha = '';
        const checkRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
        if (checkRes.ok) {
          const checkData = await checkRes.json();
          sha = checkData.sha;
        }

        const encoder = new TextEncoder();
        const data = encoder.encode(htmlTemplate);
        const base64Content = btoa(String.fromCharCode(...data));

        const res = await fetch(url, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `إضافة صفحة: ${title}`, content: base64Content, sha: sha ? sha : undefined })
        });

        if (res.ok) {
          successMsg.innerHTML = `<i class="fa-solid fa-circle-check"></i> تم نشر الصفحة بنجاح وستظهر في القائمة الرئيسية خلال دقيقة!`;
          successMsg.style.display = 'block';
          document.getElementById('pageTitle').value = '';
          document.getElementById('pageSlug').value = '';
          document.getElementById('pageContent').value = '';
        } else {
          const err = await res.json();
          throw new Error(err.message || 'حدث خطأ في الاتصال');
        }
      } catch (err) {
        errorMsg.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> خطأ: ${err.message}`;
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> حفظ ونشر الصفحة فوراً';
      }
    });
  </script>
</body>
</html>
